<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thương hiệu - Chronos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        a { text-decoration: none; color: inherit; }
        body { background:#fff; color:#333; padding-top: 90px; }
        header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background-color: #050505; padding: 10px 50px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #d4af37; font-size: 24px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; font-family: 'Times New Roman', Times, serif; }
        nav { flex: 1; display: flex; justify-content: center; }
        nav ul { list-style: none; display: flex; gap: 25px; }
        nav ul li a { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #fff; transition: color 0.3s; white-space: nowrap; }
        nav ul li a:hover, nav ul li a.active { color: #d4af37; }
        .header-icons { display: flex; align-items: center; gap: 16px; margin-left: auto; font-size: 16px; color: #fff; }
        .header-icons .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); color: #fff; text-decoration: none; position: relative; }
        .header-icons .icon-button:hover { background: rgba(255,255,255,0.16); }
        .header-icons .icon-button i { pointer-events: none; }
        .header-icons .icon-button .icon-count { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; background: #d4af37; color: #000; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; padding: 0 4px; }
        .header-icons i:hover { color: #d4af37; cursor: pointer; }
        .search-container { position: relative; display: flex; align-items: center; }
        .search-input-header { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); width: 0; opacity: 0; padding: 6px 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; transition: all 0.3s ease-in-out; background-color: #fff; color: #333; font-size: 14px; pointer-events: none; }
        .search-input-header.active { width: 220px; opacity: 1; pointer-events: auto; }

        .fixed-contact-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #d4af37;
            color: #000;
            padding: 12px 18px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
            z-index: 9999;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .fixed-contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.22);
        }

        .brands-hero { padding:30px 5px 10px; background:#fff; }
        .brands-hero h1 { font-size:24px; font-weight:700; text-transform:none; margin-bottom:8px; }
        .brands-hero p { color:#555; font-size:14px; margin-top:6px; }

        .brands-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:14px; padding:0 5% 80px; }
        .brand-card { border:1px solid #d8d8d8; border-radius:10px; padding:16px; text-align:center; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; min-height:110px; }
        .brand-card:hover { border-color:#b0b0b0; box-shadow:0 10px 24px rgba(0,0,0,0.06); }
        .brand-logo { height:54px; width:100%; display:flex; align-items:center; justify-content:center; }
        .brand-logo img { max-height:48px; max-width:100%; object-fit:contain; }
        .brand-name, .brand-tag, .brand-desc { display:none; }

        @media (max-width:1280px) { .brands-grid{grid-template-columns:repeat(5,1fr);} }
        @media (max-width:1024px) { .brands-grid{grid-template-columns:repeat(4,1fr);} }
        @media (max-width:768px) { .brands-grid{grid-template-columns:repeat(3,1fr);} header{padding:12px;} }
        @media (max-width:540px) { .brands-grid{grid-template-columns:repeat(2,1fr);} }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">CHRONOS</a>
        <nav>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html?category=Nam">Đồng hồ nam</a></li>
                <li><a href="products.html?category=Nữ">Đồng hồ nữ</a></li>
                <li><a href="brands.html">Thương hiệu</a></li>
                <li><a href="products.html?category=Bán chạy">Bán chạy</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <div class="search-container">
                <input type="text" id="header-search-input" class="search-input-header" placeholder="Nhập tên đồng hồ, hãng...">
                <i class="fas fa-search" id="search-icon"></i>
            </div>
            <a href="#" class="icon-button" id="user-icon"><i class="far fa-user"></i></a>
            <a href="wishlist.html" class="icon-button" id="wishlist-icon"><i class="fas fa-heart"></i><span class="icon-count" id="wishlist-count">0</span></a>
            <a href="cart.html" class="icon-button" id="cart-icon"><i class="fas fa-shopping-cart"></i><span class="icon-count" id="cart-count">0</span></a>
        </div>
    </header>
    <a href="https://zalo.me/g/ihfgjp538" class="fixed-contact-btn" target="_blank" rel="noopener noreferrer">Liên hệ</a>

    <section class="brands-hero">
        <h1>Thương hiệu:</h1>
        <p>Những thương hiệu đồng hồ nổi bật được tuyển chọn kỹ càng.</p>
    </section>

    <section class="brands-grid" id="brand-list">
        <!-- JS sẽ render các brand tại đây -->
    </section>

    <script src="js/auth.js"></script>
    <script src="js/brands.js"></script>
</body>
</html>
