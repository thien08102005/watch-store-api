<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Chronos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fff; color: #333; padding-top: 90px; }
        
        /* Header */
        header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background-color: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #d4af37; font-size: 24px; font-weight: bold; text-decoration: none; letter-spacing: 2px; }
        .nav-menu a { color: #fff; text-decoration: none; margin: 0 15px; font-size: 14px; font-weight: 500; transition: color 0.3s; }
        .nav-menu a:hover { color: #d4af37; }
        .nav-icons { color: #fff; font-size: 18px; display: flex; align-items: center; gap: 15px; }
        .nav-icons .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); color: #fff; text-decoration: none; position: relative; }
        .nav-icons .icon-button:hover { background: rgba(255,255,255,0.16); }
        .nav-icons .icon-button i { pointer-events: none; }
        .nav-icons .icon-button .icon-count { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; background: #d4af37; color: #000; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; padding: 0 4px; }
        .nav-icons i { cursor: pointer; }

        .search-container { position: relative; display: flex; align-items: center; }
        .search-input-header {
            position: absolute;
            right: 32px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            opacity: 0;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            transition: all 0.3s ease-in-out;
            background-color: #fff;
            color: #333;
            font-size: 14px;
            pointer-events: none;
        }
        .search-input-header.active {
            width: 220px;
            opacity: 1;
            pointer-events: auto;
        }

        .fixed-contact-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #d4af37;
            color: #000;
            padding: 12px 18px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
            z-index: 9999;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .fixed-contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.22);
        }

        /* Container Chi tiết sản phẩm */
        .detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Cột bên trái: Ảnh sản phẩm */
        .product-image-box {
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fdfdfd;
            position: relative;
            height: 450px;
        }
        .product-image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Cột bên phải: Thông tin */
        .product-info-box h1 {
            font-size: 24px;
            color: #222;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0;
        }
        .action-buttons button {
            flex: 1 1 140px;
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s ease;
        }
        .btn-buy-now {
            background: #d4af37;
            color: #000;
        }
        .btn-add-cart-detail {
            background: #000;
            color: #d4af37;
        }
        .btn-wishlist-detail {
            background: #f7f7f7;
            color: #000;
            border: 1px solid #d4af37;
        }
        .btn-wishlist-detail.active {
            background: #d4af37;
            color: #000;
        }
        .action-buttons button:hover {
            opacity: 0.95;
        }
        .rating-stars {
            color: #ffc107;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .spec-item {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }
        .spec-item strong {
            color: #000;
        }

        /* Giá tiền */
        .price-box {
            margin: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .current-price {
            font-size: 28px;
            font-weight: bold;
            color: #ff4d4f;
        }
        .old-price {
            font-size: 16px;
            color: #999;
            text-decoration: line-through;
            margin-left: 15px;
        }
        .sale-tag {
            background: #fff1f0;
            color: #ff4d4f;
            border: 1px solid #ffa39e;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            margin-left: 10px;
        }

        /* Nút hành động */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-buy-now {
            flex: 1;
            background: #3b5998;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }
        .btn-buy-now:hover { background: #324b81; }

        .btn-add-cart-detail {
            flex: 1;
            background: #4169e1;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }
        .btn-add-cart-detail:hover { background: #3154b6; }

        .hotline-box {
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }
        .hotline-box strong { color: #d4af37; }

        @media (max-width: 768px) {
            .detail-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo">CHRONOS</a>
        <nav class="nav-menu">
            <a href="index.html">TRANG CHỦ</a>
            <a href="products.html?category=Nam">ĐỒNG HỒ NAM</a>
            <a href="products.html?category=Nữ">ĐỒNG HỒ NỮ</a>
            <a href="brands.html">THƯƠNG HIỆU</a>
            <a href="products.html?category=Bán chạy">BÁN CHẠY</a>
        </nav>
        <div class="nav-icons">
            <div class="search-container">
                <input type="text" id="header-search-input" class="search-input-header" placeholder="Nhập tên đồng hồ, hãng...">
                <i class="fas fa-search" id="search-icon"></i>
            </div>
            <a href="#" class="icon-button" id="user-icon"><i class="far fa-user"></i></a>
            <a href="#" class="icon-button" id="wishlist-icon"><i class="fas fa-heart"></i><span class="icon-count" id="wishlist-count">0</span></a>
            <a href="#" class="icon-button" id="cart-icon"><i class="fas fa-shopping-cart"></i><span class="icon-count" id="cart-count">0</span></a>
        </div>
    </header>
    <a href="https://zalo.me/g/ihfgjp538" class="fixed-contact-btn" target="_blank" rel="noopener noreferrer">Liên hệ</a>

    <!-- Khu vực hiển thị chi tiết sản phẩm -->
    <div class="detail-container" id="product-detail-content">
        <p style="text-align: center; grid-column: 1/-1; padding: 50px;">Đang tải thông tin sản phẩm...</p>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/product-detail.js"></script>
</body>
</html>
