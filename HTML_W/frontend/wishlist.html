<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu thích - Chronos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input-header {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            opacity: 0;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            transition: all 0.3s ease-in-out;
            background-color: #fff;
            color: #333;
            font-size: 14px;
            pointer-events: none;
        }
        .search-input-header.active {
            width: 220px;
            opacity: 1;
            pointer-events: auto;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #222;
            padding-top: 90px;
        }
        header {
            background-color: #050505;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            height: 60px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        nav {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }
        nav ul li a {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            transition: color 0.3s;
            white-space: nowrap;
        }
        nav ul li a:hover, nav ul li a.active {
            color: #d4af37;
        }
        .header-icons {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 16px;
            color: #fff;
            margin-left: auto;
        }
        .header-icons .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            color: #fff;
            text-decoration: none;
            position: relative;
        }
        .header-icons .icon-button:hover {
            background: rgba(255,255,255,0.16);
        }
        .header-icons .icon-button .icon-count {
            position: absolute;
            top: -7px;
            right: -7px;
            min-width: 18px;
            height: 18px;
            background: #d4af37;
            color: #000;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            padding: 0 4px;
        }
        .header-icons i:hover {
            color: #d4af37;
            cursor: pointer;
        }
        .page-heading { max-width: 1200px; margin: 30px auto 0; padding: 0 20px; }
        .page-heading h1 { margin-bottom: 8px; font-size: 28px; }
        .page-heading p { color: #555; }
        .wishlist-grid { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: grid; gap: 18px; }
        .wishlist-card { background: #fff; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.05); padding: 18px; display: grid; grid-template-columns: 140px 1fr 220px; gap: 18px; align-items: center; }
        .wishlist-card img { width: 100%; height: 120px; object-fit: contain; border-radius: 10px; }
        .wishlist-info h2 { margin: 0 0 8px; font-size: 18px; }
        .wishlist-info p { margin: 6px 0; color: #555; font-size: 14px; }
        .wishlist-actions { display: flex; flex-direction: column; gap: 10px; }
        .wishlist-actions button { width: 100%; padding: 12px 14px; border-radius: 999px; border: none; font-weight: 700; cursor: pointer; }
        .btn-cart { background: #000; color: #d4af37; }
        .btn-remove { background: #f7f7f7; color: #000; border: 1px solid #d4af37; }
        .empty-state { text-align: center; padding: 80px 20px; background: #fff; border-radius: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.05); }
        .empty-state h3 { margin-bottom: 12px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 22px 20px 0;
            padding: 8px 12px;
            border: 1px solid #d4af37;
            border-radius: 999px;
            background: #fff;
            color: #111;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
        }
        .back-btn:hover {
            background: #f8f2dc;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">CHRONOS</a>
        <nav>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html?category=Nam">Đồng hồ nam</a></li>
                <li><a href="products.html?category=Nữ">Đồng hồ nữ</a></li>
                <li><a href="products.html?category=Thương hiệu">Thương hiệu</a></li>
                <li><a href="products.html?category=Bán chạy">Bán chạy</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <div class="search-container">
                <input type="text" id="header-search-input" class="search-input-header" placeholder="Nhập tên đồng hồ, hãng...">
                <i class="fas fa-search" id="search-icon"></i>
            </div>
            <a href="#" class="icon-button" id="user-icon"><i class="far fa-user"></i></a>
            <a href="wishlist.html" class="icon-button" id="wishlist-icon"><i class="far fa-heart"></i><span class="icon-count" id="wishlist-count">0</span></a>
            <a href="cart.html" class="icon-button" id="cart-icon"><i class="fas fa-shopping-cart"></i><span class="icon-count" id="cart-count">0</span></a>
        </div>
    </header>

    <script>
        function goBackOrHome() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>

    <button class="back-btn" type="button" onclick="goBackOrHome()" title="Quay lại"><i class="fas fa-arrow-left"></i> Quay lại</button>

    <section class="page-heading">
        <h1>Danh sách yêu thích</h1>
        <p>Những sản phẩm bạn đã thêm vào danh sách yêu thích.</p>
    </section>

    <section class="wishlist-grid" id="wishlist-container">
        <div class="empty-state">
            <h3>Chưa có sản phẩm yêu thích.</h3>
            <p>Hãy vào trang sản phẩm và thêm những mẫu đồng hồ bạn yêu thích vào đây.</p>
        </div>
    </section>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const showIcons = () => {
                ['wishlist-icon', 'cart-icon', 'user-icon'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = 'inline-flex';
                        el.style.visibility = 'visible';
                        el.style.opacity = '1';
                        el.style.pointerEvents = 'auto';
                    }
                });
                document.querySelectorAll('.icon-count').forEach(count => {
                    count.style.display = 'inline-flex';
                    count.style.visibility = 'visible';
                    count.style.opacity = '1';
                });
            };
            showIcons();
            setTimeout(showIcons, 200);
            window.addEventListener('load', showIcons);

            const searchIcon = document.getElementById('search-icon');
            const searchInput = document.getElementById('header-search-input');
            if (searchIcon && searchInput) {
                searchIcon.addEventListener('click', () => {
                    searchInput.classList.toggle('active');
                    if (searchInput.classList.contains('active')) {
                        searchInput.focus();
                    } else {
                        searchInput.blur();
                    }
                });
            }
        });

        async function fetchProductMap() {
            try {
                const response = await fetch('http://localhost:5000/api/products');
                const data = await response.json();
                const products = Array.isArray(data) ? data : data.data || data.products || [];
                return products.reduce((map, product) => {
                    map[product._id] = product;
                    return map;
                }, {});
            } catch (error) {
                console.error('Lỗi lấy sản phẩm:', error);
                return {};
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const wishlistContainer = document.getElementById('wishlist-container');

            const renderWishlist = async () => {
                const wishlistItems = getWishlistItems();
                updateHeaderCounts();
                const productMap = await fetchProductMap();

                if (!wishlistItems.length) {
                    wishlistContainer.innerHTML = `
                        <div class="empty-state">
                            <h3>Chưa có sản phẩm yêu thích.</h3>
                            <p>Hãy vào trang sản phẩm và thêm những mẫu đồng hồ bạn yêu thích vào đây.</p>
                        </div>
                    `;
                    return;
                }

                wishlistContainer.innerHTML = wishlistItems.map(item => {
                    const product = productMap[item.id] || {};
                    const imageUrl = product.imageUrl || item.imageUrl || 'https://images.unsplash.com/photo-1524805444758-089113d48a6d?q=80&w=500';
                    const price = product.price || item.price;
                    const brand = product.brand || item.brand || 'Chưa xác định';
                    return `
                        <div class="wishlist-card">
                            <img src="${imageUrl}" alt="${item.name}">
                            <div class="wishlist-info">
                                <h2>${item.name}</h2>
                                <p>Giá: ${price ? price.toLocaleString('vi-VN') + ' đ' : 'Chưa có giá'}</p>
                                <p>Thương hiệu: ${brand}</p>
                            </div>
                            <div class="wishlist-actions">
                                <button class="btn-cart" data-action="add-cart" data-product-id="${item.id}" data-product-name=${JSON.stringify(item.name)}>Thêm vào giỏ</button>
                                <button class="btn-remove" data-action="remove-wishlist" data-product-id="${item.id}" data-product-name=${JSON.stringify(item.name)}>Xóa khỏi yêu thích</button>
                            </div>
                        </div>
                    `;
                }).join('');

                wishlistContainer.querySelectorAll('button[data-action="add-cart"]').forEach(button => {
                    button.addEventListener('click', () => {
                        const productId = button.dataset.productId;
                        const productName = button.dataset.productName;
                        window.CHRONOS_AUTH?.handleProtectedAddToCart(productId, productName);
                    });
                });

                wishlistContainer.querySelectorAll('button[data-action="remove-wishlist"]').forEach(button => {
                    button.addEventListener('click', async () => {
                        const productId = button.dataset.productId;
                        const productName = button.dataset.productName;
                        const result = window.CHRONOS_AUTH?.handleToggleWishlist(productId, productName);
                        if (result && !result.added) {
                            const card = button.closest('.wishlist-card');
                            if (card) card.remove();
                            updateHeaderCounts();
                            if (!wishlistContainer.querySelector('.wishlist-card')) {
                                wishlistContainer.innerHTML = `
                                    <div class="empty-state">
                                        <h3>Chưa có sản phẩm yêu thích.</h3>
                                        <p>Hãy vào trang sản phẩm và thêm những mẫu đồng hồ bạn yêu thích vào đây.</p>
                                    </div>
                                `;
                            }
                        }
                    });
                });
            };

            await renderWishlist();
        });
    </script>
</body>
</html>
