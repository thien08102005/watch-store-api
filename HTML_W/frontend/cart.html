<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - Chronos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input-header {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            opacity: 0;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            transition: all 0.3s ease-in-out;
            background-color: #fff;
            color: #333;
            font-size: 14px;
            pointer-events: none;
        }
        .search-input-header.active {
            width: 220px;
            opacity: 1;
            pointer-events: auto;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #222;
            padding-top: 90px;
        }
        header {
            background-color: #050505;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            height: 60px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        nav {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }
        nav ul li a {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            transition: color 0.3s;
            white-space: nowrap;
        }
        nav ul li a:hover, nav ul li a.active {
            color: #d4af37;
        }
        .header-icons {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 16px;
            color: #fff;
            margin-left: auto;
        }
        .header-icons .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            color: #fff;
            text-decoration: none;
            position: relative;
        }
        .header-icons .icon-button:hover {
            background: rgba(255,255,255,0.16);
        }
        .header-icons .icon-button .icon-count {
            position: absolute;
            top: -7px;
            right: -7px;
            min-width: 18px;
            height: 18px;
            background: #d4af37;
            color: #000;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            padding: 0 4px;
        }
        .header-icons i:hover {
            color: #d4af37;
            cursor: pointer;
        }
        .page-heading { max-width: 1200px; margin: 30px auto 0; padding: 0 20px; }
        .page-heading h1 { margin-bottom: 8px; font-size: 28px; }
        .page-heading p { color: #555; }
        .cart-grid { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: grid; gap: 18px; }
        .cart-card { background: #fff; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.05); padding: 18px; display: grid; grid-template-columns: 140px 1fr 200px; gap: 18px; align-items: center; }
        .cart-card img { width: 100%; height: 120px; object-fit: contain; border-radius: 10px; }
        .cart-info h2 { margin: 0 0 8px; font-size: 18px; }
        .cart-info p { margin: 6px 0; color: #555; font-size: 14px; }
        .cart-actions { display: flex; flex-direction: column; gap: 10px; }
        .cart-actions button, .cart-quantity button { padding: 10px 14px; border-radius: 999px; border: none; font-weight: 700; cursor: pointer; }
        .cart-actions button { width: 100%; }
        .cart-quantity { display: flex; gap: 8px; align-items: center; }
        .cart-quantity span { min-width: 26px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
        .btn-remove { background: #f7f7f7; color: #000; border: 1px solid #d4af37; }
        .btn-checkout { background: #d4af37; color: #000; }
        .empty-state { text-align: center; padding: 80px 20px; background: #fff; border-radius: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.05); }
        .empty-state h3 { margin-bottom: 12px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 22px 20px 0;
            padding: 8px 12px;
            border: 1px solid #d4af37;
            border-radius: 999px;
            background: #fff;
            color: #111;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
        }
        .back-btn:hover {
            background: #f8f2dc;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">CHRONOS</a>
        <nav>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html?category=Nam">Đồng hồ nam</a></li>
                <li><a href="products.html?category=Nữ">Đồng hồ nữ</a></li>
                <li><a href="products.html?category=Thương hiệu">Thương hiệu</a></li>
                <li><a href="products.html?category=Bán chạy">Bán chạy</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <div class="search-container">
                <input type="text" id="header-search-input" class="search-input-header" placeholder="Nhập tên đồng hồ, hãng...">
                <i class="fas fa-search" id="search-icon"></i>
            </div>
            <a href="#" class="icon-button" id="user-icon"><i class="far fa-user"></i></a>
            <a href="wishlist.html" class="icon-button" id="wishlist-icon"><i class="far fa-heart"></i><span class="icon-count" id="wishlist-count">0</span></a>
            <a href="cart.html" class="icon-button" id="cart-icon"><i class="fas fa-shopping-cart"></i><span class="icon-count" id="cart-count">0</span></a>
        </div>
    </header>

    <script>
        function goBackOrHome() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>

    <button class="back-btn" type="button" onclick="goBackOrHome()" title="Quay lại"><i class="fas fa-arrow-left"></i> Quay lại</button>

    <section class="page-heading">
        <h1>Giỏ hàng của bạn</h1>
        <p>Xem lại sản phẩm đã thêm và chỉnh sửa số lượng trước khi thanh toán.</p>
    </section>

    <section class="cart-grid" id="cart-container">
        <div class="empty-state">
            <h3>Giỏ hàng trống.</h3>
            <p>Chọn sản phẩm bạn muốn mua và thêm vào giỏ.</p>
        </div>
    </section>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const showIcons = () => {
                ['wishlist-icon', 'cart-icon', 'user-icon'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = 'inline-flex';
                        el.style.visibility = 'visible';
                        el.style.opacity = '1';
                        el.style.pointerEvents = 'auto';
                    }
                });
                document.querySelectorAll('.icon-count').forEach(count => {
                    count.style.display = 'inline-flex';
                    count.style.visibility = 'visible';
                    count.style.opacity = '1';
                });
            };
            showIcons();
            setTimeout(showIcons, 200);
            window.addEventListener('load', showIcons);

            const searchIcon = document.getElementById('search-icon');
            const searchInput = document.getElementById('header-search-input');
            if (searchIcon && searchInput) {
                searchIcon.addEventListener('click', () => {
                    searchInput.classList.toggle('active');
                    if (searchInput.classList.contains('active')) {
                        searchInput.focus();
                    } else {
                        searchInput.blur();
                    }
                });
            }
        });

        async function fetchProductMap() {
            try {
                const response = await fetch('http://localhost:5000/api/products');
                const data = await response.json();
                const products = Array.isArray(data) ? data : data.data || data.products || [];
                return products.reduce((map, product) => {
                    map[product._id] = product;
                    return map;
                }, {});
            } catch (error) {
                console.error('Lỗi lấy sản phẩm:', error);
                return {};
            }
        }

        function removeCartItem(itemId) {
            const updated = getCartItems().filter(it => it.id !== itemId);
            saveCartItems(updated);
            renderCart();
        }

        function updateCartQuantity(itemId, delta) {
            const cartItems = getCartItems();
            const item = cartItems.find(it => it.id === itemId);
            if (!item) return;
            const currentQty = Number(item.quantity || 1);
            const nextQty = Math.max(1, currentQty + delta);
            item.quantity = nextQty;
            saveCartItems(cartItems);
            renderCart();
        }

        function setCartQuantity(itemId, value) {
            const cartItems = getCartItems();
            const item = cartItems.find(it => it.id === itemId);
            if (!item) return;
            const nextQty = Math.max(1, Number(value) || 1);
            item.quantity = nextQty;
            saveCartItems(cartItems);
            renderCart();
        }

        function isSameCartAsOrder(cartItems, orderItems) {
            if (!Array.isArray(cartItems) || !Array.isArray(orderItems)) return false;
            if (cartItems.length !== orderItems.length) return false;
            const normalizedCart = cartItems
                .map(item => ({ id: item.id, quantity: Number(item.quantity) || 1 }))
                .sort((a, b) => a.id.localeCompare(b.id));
            const normalizedOrder = orderItems
                .map(item => ({ id: item.productId || item.id || '', quantity: Number(item.quantity) || 1 }))
                .sort((a, b) => a.id.localeCompare(b.id));
            return normalizedCart.every((cartItem, index) => {
                const orderItem = normalizedOrder[index] || {};
                return cartItem.id === orderItem.id && cartItem.quantity === orderItem.quantity;
            });
        }

        async function clearCartIfOrderApproved(cartItems) {
            const user = getCurrentUser();
            if (!user || !Array.isArray(cartItems) || !cartItems.length) return false;
            try {
                const res = await fetch('http://localhost:5000/api/orders/mine', {
                    headers: { Authorization: `Bearer ${user.token}` }
                });
                const data = await res.json();
                if (!res.ok || !data.success || !Array.isArray(data.data)) return false;
                const approvedOrder = data.data.find(order => order.status === 'Đã duyệt' && isSameCartAsOrder(cartItems, order.items));
                if (approvedOrder) {
                    saveCartItems([]);
                    updateHeaderCounts();
                    return true;
                }
            } catch (error) {
                console.warn('Không thể kiểm tra đơn đã duyệt:', error);
            }
            return false;
        }

        // Remove or reduce cart items that were already included in approved orders.
        // For each approved order item, subtract its quantity from the cart item quantity.
        // If resulting quantity <= 0 remove the item entirely.
        async function syncCartWithApprovedOrders(cartItems) {
            const user = getCurrentUser();
            if (!user || !Array.isArray(cartItems) || !cartItems.length) return false;
            try {
                const res = await fetch('http://localhost:5000/api/orders/mine', {
                    headers: { Authorization: `Bearer ${user.token}` }
                });
                const data = await res.json();
                if (!res.ok || !data.success || !Array.isArray(data.data)) return false;

                // ✅ FIXED: Chỉ xóa giỏ nếu nó khớp với đơn hàng CUỐI CÙNG được duyệt
                // ❌ KHÔNG xóa dựa trên các đơn hàng cũ hoặc bất kỳ đơn nào khác
                // Lý do: Khách hàng phải có quyền mua lại sản phẩm bao nhiêu lần tùy ý

                const lastOrderId = localStorage.getItem('chronos_last_order_id');
                if (lastOrderId) {
                    const matched = data.data.find(o => (o._id === lastOrderId || o.id === lastOrderId || String(o._id) === String(lastOrderId)) && o.status === 'Đã duyệt');
                    if (matched) {
                        try {
                            saveCartItems([]);
                            sessionStorage.setItem('chronos_cart_cleared_by_approval', '1');
                            localStorage.removeItem('chronos_last_order_id');
                            updateHeaderCounts();
                            try { window.dispatchEvent(new CustomEvent('cartUpdated', { detail: { items: [] } })); } catch (e) {}
                        } catch (e) {}
                        return true;
                    }
                }

                // ❌ REMOVED: Không còn so sánh với isSameCartAsOrder()
                // Lý do: Điều này khiến giỏ bị xóa nếu nó khớp với BẤT KỲ đơn đã duyệt nào
                // Chỉ xóa giỏ khi nó khớp với đơn CUỐI CÙNG được duyệt (lastOrderId)
            } catch (error) {
                console.warn('Không thể đồng bộ giỏ với đơn đã duyệt:', error);
            }
            return false;
        }

        async function renderCart() {
            const cartContainer = document.getElementById('cart-container');
            if (!cartContainer) return;

            const user = getCurrentUser();
            const restrictedRole = user && ['manager', 'staff', 'admin'].includes(user.role);
            updateHeaderCounts();
            if (restrictedRole) {
                cartContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>Nhân viên/quản lý không sử dụng giỏ hàng.</h3>
                        <p>Vai trò ${user.role} chỉ quản lý đơn hàng, không cần giỏ hàng mua sắm.</p>
                    </div>
                `;
                return;
            }

            let cartItems = getCartItems();
            if (!cartItems.length) {
                renderEmptyCart();
                return;
            }

            // Attempt to sync cart with any approved orders so products
            // that were purchased and approved by staff are removed or reduced.
            // This is a targeted sync (doesn't clear the whole cart).
            try {
                const synced = await syncCartWithApprovedOrders(cartItems);
                if (synced) {
                    cartItems = getCartItems();
                    if (!cartItems.length) {
                        const showApprovedMsg = sessionStorage.getItem('chronos_cart_cleared_by_approval');
                        if (showApprovedMsg) {
                            sessionStorage.removeItem('chronos_cart_cleared_by_approval');
                            renderEmptyCart('Đơn đã được phê duyệt, giỏ hàng đã được làm mới.', 'Các sản phẩm trong giỏ đã được chuyển vào đơn và được nhân viên duyệt.');
                            return;
                        }
                        renderEmptyCart();
                        return;
                    }
                }
            } catch (e) {
                // ignore sync errors and continue rendering current cart
            }

            const productMap = await fetchProductMap();
            const totalPrice = cartItems.reduce((sum, item) => {
                const product = productMap[item.id] || {};
                const p = product.price || item.price || 0;
                return sum + (p * (Number(item.quantity) || 1));
            }, 0);
            const totalQuantity = cartItems.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);

            const cardsHTML = cartItems.map(item => {
                const product = productMap[item.id] || {};
                const imageUrl = product.imageUrl || item.imageUrl || 'https://images.unsplash.com/photo-1524805444758-089113d48a6d?q=80&w=500';
                const price = product.price || item.price || 0;
                const quantity = item.quantity || 1;
                const itemTotal = price * quantity;
                const safeProductName = String(item.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                return `
                    <div class="cart-card" data-item-id="${item.id}">
                        <img src="${imageUrl}" alt="${item.name}">
                        <div class="cart-info">
                            <h2>${item.name}</h2>
                            <p>Giá: ${price ? price.toLocaleString('vi-VN') + ' đ' : 'Chưa có giá'}</p>
                            <div class="cart-quantity">
                                <button type="button" onclick="updateCartQuantity('${item.id}', -1)">-</button>
                                <input type="number" min="1" value="${quantity}" onchange="setCartQuantity('${item.id}', this.value)" style="width: 60px; text-align: center; border: 1px solid #ccc; border-radius: 8px; padding: 6px;">
                                <button type="button" onclick="updateCartQuantity('${item.id}', 1)">+</button>
                            </div>
                            <p style="margin-top: 8px; font-weight:700;">Thành tiền: ${itemTotal.toLocaleString('vi-VN')} đ</p>
                        </div>
                        <div class="cart-actions">
                            <button class="btn-checkout" onclick="window.CHRONOS_AUTH?.showCheckoutModal('${safeProductName}', ${price}, '${item.id}', ${quantity})">Thanh toán món này</button>
                            <button class="btn-remove" onclick="removeCartItem('${item.id}')">Xóa</button>
                        </div>
                    </div>
                `;
            }).join('');

            const summaryHTML = `
                <div style="background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-top: 10px;">
                    <div>
                        <h3 style="margin: 0 0 5px 0;">Tổng cộng giỏ hàng (${cartItems.length} món, ${totalQuantity} chiếc)</h3>
                        <p style="margin: 0; color: #555; font-size: 16px;">Tổng tiền: <strong style="color: #d4af37; font-size: 20px;">${totalPrice > 0 ? totalPrice.toLocaleString('vi-VN') + ' đ' : 'Liên hệ'}</strong></p>
                    </div>
                    <button class="btn-checkout" style="padding: 12px 28px; font-size: 16px; width: auto;" onclick="window.CHRONOS_AUTH?.showCheckoutModal('Giỏ hàng', ${totalPrice}, 'Giỏ hàng', ${totalQuantity})">Thanh toán tất cả</button>
                </div>
            `;

            cartContainer.innerHTML = cardsHTML + summaryHTML;
            updateHeaderCounts();
        }
        
        function renderEmptyCart(title = 'Giỏ hàng trống.', message = 'Chọn sản phẩm bạn muốn mua và thêm vào giỏ.') {
            const cartContainer = document.getElementById('cart-container');
            if (!cartContainer) return;
            cartContainer.innerHTML = `
                <div class="empty-state">
                    <h3>${title}</h3>
                    <p>${message}</p>
                </div>
            `;
        }
        
        // Expose render function so other scripts can call it directly
        try { window.renderCart = renderCart; } catch (e) { /* ignore */ }

        // Listen for same-page custom event (dispatched by auth.js)
        window.addEventListener('cartUpdated', (e) => {
            try { console.debug('cartUpdated event received', e && e.detail); } catch(e){}
            try { renderCart(); } catch (err) { /* ignore */ }
        });

        // Listen for storage changes from other tabs/windows
        window.addEventListener('storage', (e) => {
            try { console.debug('storage event', e && e.key); } catch(e){}
            if (e.key === 'chronos_cart' || e.key === 'chronos_cart_sync') {
                try { renderCart(); } catch (err) { /* ignore */ }
            }
        });

        // Re-render when the tab/window regains focus (helps when user adds in another tab)
        window.addEventListener('focus', () => {
            try { console.debug('window focus -> renderCart'); } catch(e){}
            try { renderCart(); } catch (err) { /* ignore */ }
        });

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
