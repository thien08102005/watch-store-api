version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chronos-backend
    restart: always
    environment:
      PORT: 5000
      MONGO_URI: mongodb://host.docker.internal:27017/ChronosWatchDB
      JWT_SECRET: supersecret
    ports:
      - '5000:5000'

  frontend:
    image: nginx:alpine
    container_name: chronos-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '80:80'
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
