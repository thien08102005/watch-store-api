openapi: 3.0.0
info:
  title: API Cửa hàng đồng hồ Chronos
  version: 1.0.0
  description: Tài liệu RESTful API cho đồ án môn Công nghệ phần mềm
servers:
  - url: http://localhost:5000
paths:
  /api/products:
    get:
      summary: Lấy danh sách sản phẩm
      responses:
        '200':
          description: Trả về danh sách đồng hồ thành công
    post:
      summary: Thêm sản phẩm (quản lý hoặc nhân viên)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Thêm sản phẩm thành công
        '403':
          description: Không có quyền
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
